# 屋脊板上的标记。camera.launch.py 给每个编号各起一个 aruco_pose 节点，话题在 /marker_<编号>/aruco/...
# 每个节点只解自己那一块，互不影响。两块怎么合（融合、只取一块、还是别的）等录完数据离线再定。

dictionary: DICT_4X4_50
side_m: 0.07     # 黑方块外沿。打印后用尺子量，改成实测值：边长差 2%，距离就差 2%
ids: [0, 1]

# 下面这些代码不用，只是记下屋脊板的样子，回来离线分析时要用。量好了再改。
dihedral_deg: 115   # 两块板之间的夹角（板内侧量），大约 110–120°
