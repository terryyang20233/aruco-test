# 标定结果。记号见 实验方案.md §4.1：T_A_B 是 B 在 A 里的位姿，平移单位米，四元数 (x, y, z, w)。
# 在实验室做完 C2（手眼标定）之前，下面都是单位阵占位。

marker:
  id: 0
  side_m: 0.15          # 打印后实测的黑方块外沿
  dictionary: DICT_4X4_50

# X = T_R_C：彩色相机光心（OpenCV optical frame）在相机支架刚体里的位姿
X_rig_color:
  translation: [0.0, 0.0, 0.0]
  quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

# 红外 1 号相机光心在相机支架刚体里的位姿
X_rig_ir:
  translation: [0.0, 0.0, 0.0]
  quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

# Y = T_B_M：ArUco 标记中心（X 右、Y 上、Z 朝相机）在标记板刚体里的位姿
Y_board_marker:
  translation: [0.0, 0.0, 0.0]
  quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]

# mocap 时间 = 图像时间 + time_offset_s（§4.3 用晃动互相关估出来）
time_offset_s: 0.0
